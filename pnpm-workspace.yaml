packages:
  - .

# CI and release installs intentionally execute neither binary installers nor browser downloads.
allowBuilds:
  lefthook: false

# Security overrides must be read by the package manager that resolves the lockfile.
overrides:
  '@hono/node-server': 2.1.5
  body-parser: 2.4.0
  'brace-expansion@>=4': 5.0.12
  fast-copy: 4.1.0
  fast-uri: 3.1.9
  follow-redirects: 1.16.1
  form-data: 4.0.6
  hono: 4.13.13
  ip-address: 10.7.4
  js-yaml: 4.3.1
  proxy-addr: 2.0.8
  qs: 6.17.0
  source-map-js: 1.2.2
  tmp: 0.2.7
  undici: 7.30.1
