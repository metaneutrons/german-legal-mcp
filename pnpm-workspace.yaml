packages:
  - .

# CI and release installs intentionally execute neither binary installers nor browser downloads.
allowBuilds:
  lefthook: false

# Security overrides must be read by the package manager that resolves the lockfile.
overrides:
  '@hono/node-server': 2.1.6
  body-parser: 2.4.0
  'brace-expansion@>=4': 5.0.12
  fast-copy: 4.3.1
  fast-uri: 4.2.3
  follow-redirects: 1.16.2
  form-data: 4.0.6
  hono: 4.13.16
  ip-address: 10.7.5
  js-yaml: 5.5.0
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  tmp: 0.2.7
  undici: 8.12.3
