packages:
  - .

# CI and release installs intentionally execute neither binary installers nor browser downloads.
allowBuilds:
  lefthook: false

# Security overrides must be read by the package manager that resolves the lockfile.
overrides:
  'brace-expansion@>=4': 5.0.12
  fast-copy: 4.1.0
  fast-uri: 3.1.8
  form-data: 4.0.6
  hono: 4.13.7
  ip-address: 10.7.1
  js-yaml: 4.3.1
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  tmp: 0.2.7
  undici: 7.29.1
