name: Publish public release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed v-prefixed tag to verify without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Bind public release identity
        id: identity
        run: |
          node scripts/verify-public-release-ref.mjs "$RELEASE_TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Preflight immutable public destinations
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-destinations.mjs "$RELEASE_TAG"
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=moderate

  artifacts:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      npm_tarball: ${{ steps.npm_pack.outputs.filename }}
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-public-release-ref.mjs "$RELEASE_TAG"
      - run: npm run build

      - name: Pack and verify exact npm artifact
        id: npm_pack
        run: |
          mkdir release-artifacts
          npm pack --ignore-scripts --json --pack-destination release-artifacts > "$RUNNER_TEMP/npm-pack.json"
          filename=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/npm-pack.json','utf8'))[0].filename")
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "path=$GITHUB_WORKSPACE/release-artifacts/$filename" >> "$GITHUB_OUTPUT"
          node scripts/verify-package.mjs --tarball "$GITHUB_WORKSPACE/release-artifacts/$filename"

      - name: Generate npm CycloneDX SBOM
        id: npm_sbom
        run: |
          path="$GITHUB_WORKSPACE/release-artifacts/german-legal-mcp-${{ needs.verify.outputs.version }}.sbom.cdx.json"
          npm sbom --omit=dev --sbom-format cyclonedx > "$path"
          node -e "const s=require(process.argv[1]);if(!Array.isArray(s.components))throw new Error('Invalid SBOM')" "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Assemble production-only public MCPB tree
        run: |
          stage="$RUNNER_TEMP/mcpb-stage"
          mkdir "$stage"
          git archive HEAD | tar -x -C "$stage"
          cp -R dist "$stage/dist"
          (cd "$stage" && npm ci --omit=dev --ignore-scripts)
          node "$stage/scripts/prepare-mcpb-runtime.mjs" "$stage"

      - name: Verify production-only public MCPB tree
        working-directory: ${{ runner.temp }}/mcpb-stage
        run: |
          node scripts/verify-tool-names.mjs
          node scripts/verify-runtime-tools.mjs
          node scripts/verify-package.mjs
          node scripts/smoke-startup.mjs

      - name: Generate public MCPB CycloneDX SBOM
        id: mcpb_sbom
        run: |
          path="$GITHUB_WORKSPACE/release-artifacts/german-legal-mcp-${RELEASE_TAG}.sbom.cdx.json"
          (cd "$RUNNER_TEMP/mcpb-stage" && npm sbom --omit=dev --sbom-format cyclonedx) > "$path"
          node -e "const s=require(process.argv[1]);if(!Array.isArray(s.components))throw new Error('Invalid SBOM')" "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Reproducibly pack and verify public MCPB
        id: mcpb_pack
        run: |
          path="$GITHUB_WORKSPACE/release-artifacts/german-legal-mcp.mcpb"
          reproduction="$RUNNER_TEMP/german-legal-mcp.reproduction.mcpb"
          node_modules/.bin/mcpb pack "$RUNNER_TEMP/mcpb-stage" "$path"
          node scripts/normalize-mcpb-artifact.mjs "$path"
          node_modules/.bin/mcpb pack "$RUNNER_TEMP/mcpb-stage" "$reproduction"
          node scripts/normalize-mcpb-artifact.mjs "$reproduction"
          cmp --silent "$path" "$reproduction"
          node scripts/normalize-mcpb-artifact.mjs --check "$path"
          node scripts/verify-mcpb-artifact.mjs "$path"
          rm "$reproduction"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Create subject-bound provenance and checksums
        env:
          NPM_TARBALL: ${{ steps.npm_pack.outputs.path }}
          NPM_SBOM: ${{ steps.npm_sbom.outputs.path }}
          MCPB_BUNDLE: ${{ steps.mcpb_pack.outputs.path }}
          MCPB_SBOM: ${{ steps.mcpb_sbom.outputs.path }}
        run: |
          node scripts/release-provenance.mjs create \
            release-artifacts "$RELEASE_TAG" public "$GITHUB_REPOSITORY" \
            "${{ needs.verify.outputs.commit }}" publish-public.yml \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          cd release-artifacts
          sha256sum "$(basename "$NPM_TARBALL")" \
            "$(basename "$NPM_SBOM")" \
            "$(basename "$MCPB_BUNDLE")" \
            "$(basename "$MCPB_SBOM")" \
            provenance.intoto.jsonl > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Verify exact public candidate boundary
        env:
          NPM_TARBALL: ${{ steps.npm_pack.outputs.filename }}
        run: >-
          node scripts/verify-release-candidate.mjs --flavor public
          release-artifacts "$RELEASE_TAG" "$NPM_TARBALL"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-public-candidate-${{ needs.verify.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push'
    needs: [verify, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: public-release-production
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-public-candidate-${{ needs.verify.outputs.version }}
          path: release-artifacts
      - name: Re-verify downloaded candidate and invocation
        env:
          NPM_TARBALL: ${{ needs.artifacts.outputs.npm_tarball }}
        run: |
          node scripts/verify-public-release-ref.mjs "$RELEASE_TAG"
          node scripts/verify-release-candidate.mjs --flavor public \
            release-artifacts "$RELEASE_TAG" "$NPM_TARBALL"
          node scripts/release-provenance.mjs verify \
            release-artifacts "$RELEASE_TAG" public "$GITHUB_REPOSITORY" \
            "${{ needs.verify.outputs.commit }}" publish-public.yml \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          node -e '
            const [major, minor, patch] = process.env.npm_config_user_agent
              .match(/npm\/(\d+)\.(\d+)\.(\d+)/).slice(1).map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              throw new Error("npm " + [major, minor, patch].join(".")
                + " lacks trusted publishing support");
            }
          '

      - name: Attest every exact public release subject
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-artifacts/${{ needs.artifacts.outputs.npm_tarball }}
            release-artifacts/german-legal-mcp-${{ needs.verify.outputs.version }}.sbom.cdx.json
            release-artifacts/german-legal-mcp.mcpb
            release-artifacts/german-legal-mcp-${{ needs.verify.outputs.tag }}.sbom.cdx.json
            release-artifacts/provenance.intoto.jsonl
            release-artifacts/SHA256SUMS

      - name: Stage draft, publish exact tarball through OIDC, then promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TARBALL: ${{ needs.artifacts.outputs.npm_tarball }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "${{ needs.verify.outputs.commit }}" \
            --draft \
            --generate-notes \
            --title "$RELEASE_TAG" \
            "release-artifacts/$NPM_TARBALL" \
            "release-artifacts/german-legal-mcp-${{ needs.verify.outputs.version }}.sbom.cdx.json" \
            release-artifacts/german-legal-mcp.mcpb \
            "release-artifacts/german-legal-mcp-${{ needs.verify.outputs.tag }}.sbom.cdx.json" \
            release-artifacts/provenance.intoto.jsonl \
            release-artifacts/SHA256SUMS

          npm publish "release-artifacts/$NPM_TARBALL" \
            --ignore-scripts \
            --access public \
            --provenance \
            --registry https://registry.npmjs.org

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
